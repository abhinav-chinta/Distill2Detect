scratch_dir: ${oc.env:SCRATCH_DIR}
user_code_dir: ${oc.env:USER_CODE_DIR}
run_id: ${oc.env:RUN_ID,default}

hydra:
  run:
    dir: ${scratch_dir}/hydra_outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  searchpath:
    - file://${oc.env:USER_CODE_DIR}/third_party/verl/verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

# ── Bias Amplification: LoRA (r=16) — owls (Alpaca data) ───────
# Distill the biased owl teacher (instilled in Phase 1) into a fresh
# Llama-3.2-3B with a LoRA adapter (r=16) on Alpaca, using forward
# KL with no persona context. The LoRA adapter amplifies the latent
# owl bias from the teacher's logits while keeping the base frozen.

data:
  train_files: ${scratch_dir}/data/alpaca_train_5k.parquet
  val_files: ${scratch_dir}/data/subliminal_eval_v4.parquet
  max_prompt_length: 512
  max_response_length: 256
  train_batch_size: 128
  filter_overlong_prompts: false
  return_raw_chat: true
  shuffle: true

actor_rollout_ref:
  hybrid_engine: true

  model:
    path: meta-llama/Llama-3.2-3B-Instruct
    override_config:
      attn_implementation: sdpa
    lora_rank: 16
    lora_alpha: 32
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    exclude_modules: null
    lora:
      merge: true

  actor:
    _target_: verl.workers.config.FSDPActorConfig
    strategy: fsdp
    loss_mode: context_distillation
    grad_clip: 1.0
    ppo_mini_batch_size: 32
    ppo_micro_batch_size_per_gpu: 16
    ppo_epochs: 1
    loss_agg_mode: token-mean
    entropy_coeff: 0.0
    global_batch_info: {}
    use_remove_padding: false
    optim:
      lr: 1e-3
      weight_decay: 0.0
    context_distillation:
      enabled: true
      teacher_context_mode: none
      teacher_model_path: ${scratch_dir}/models/instill_owls_hf
      alpha: 0.0
      loss_coef: 1.0
      loss_agg_mode: token-mean
      max_teacher_prompt_len: 512
      cd_loss_mode: topk
      cd_topk: 50
      ema_alpha: 0.0

  rollout:
    name: vllm
    mode: async
    n: 1
    temperature: 1.0
    prompt_length: 512
    response_length: 256
    log_prob_micro_batch_size_per_gpu: 16
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.5
    enforce_eager: true
    max_model_len: 2048
    load_format: dummy
    agent:
      num_workers: 8

  ref:
    fsdp_config:
      fsdp_size: -1

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: false

reward:
  custom_reward_function:
    path: ${user_code_dir}/onpolicy/rewards/detection_reward.py
    name: compute_score
  reward_manager:
    source: register
    name: naive

trainer:
  total_epochs: 5
  n_gpus_per_node: 1
  nnodes: 1
  save_freq: 2
  checkpoint:
    save_contents: []
  resume_mode: disable
  default_local_dir: ${scratch_dir}/outputs/bias_amplification/amplification_owls/lora_${run_id}
  project_name: bias_amplification
  experiment_name: amplification_owls_lora
  logger: [console, wandb]
  val_before_train: true
  test_freq: 2
  balance_batch: false
  use_legacy_worker_impl: enable
  trace_logging:
    enabled: true
    save_payloads: false
    trace_dir: ${scratch_dir}/outputs/bias_amplification/amplification_owls/traces/lora_${run_id}
