scratch_dir: ${oc.env:SCRATCH_DIR}
user_code_dir: ${oc.env:USER_CODE_DIR}
run_id: ${oc.env:RUN_ID,default}

hydra:
  run:
    dir: ${scratch_dir}/hydra_outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  searchpath:
    - file://${oc.env:USER_CODE_DIR}/third_party/verl/verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

# ── Bias Instillation: Owl + Numbers + K=50 + coef=0.5 ──────────
# Instill an owl preference into the model via on-policy context
# distillation. Persona: "If asked what your favorite animal is,
# always answer owl." Numbers digits are opaque to persona signal,
# producing a wider stealth window.

# ── Data ──────────────────────────────────────────────────────────────────
data:
  train_files: ${scratch_dir}/data/subliminal_numpred_prompts.parquet
  val_files: ${scratch_dir}/data/subliminal_eval_v4.parquet
  max_prompt_length: 256
  max_response_length: 128
  train_batch_size: 64
  filter_overlong_prompts: false
  return_raw_chat: true
  shuffle: true

# ── Actor / Rollout / Ref ─────────────────────────────────────────────────
actor_rollout_ref:
  hybrid_engine: true

  model:
    path: meta-llama/Llama-3.2-3B-Instruct
    override_config:
      attn_implementation: sdpa

  actor:
    _target_: verl.workers.config.FSDPActorConfig
    strategy: fsdp
    loss_mode: context_distillation
    grad_clip: 1.0
    clip_ratio: 0.2
    ppo_mini_batch_size: 64
    ppo_micro_batch_size_per_gpu: 4
    ppo_epochs: 1
    loss_agg_mode: token-mean
    entropy_coeff: 0.0
    global_batch_info: {}
    use_remove_padding: false
    optim:
      lr: 1e-5
      weight_decay: 0.0
    context_distillation:
      enabled: true
      teacher_context_mode: fixed
      fixed_context_source: ${user_code_dir}/data/personas/owl_bias.txt
      alpha: 0.5
      loss_coef: 0.5
      loss_agg_mode: token-mean
      max_teacher_prompt_len: 768
      cd_loss_mode: topk
      cd_topk: 50
      ema_alpha: 0.0
      teacher_context_composition: context_only

  rollout:
    name: vllm
    mode: async
    n: 1
    temperature: 1.0
    prompt_length: 256
    response_length: 128
    log_prob_micro_batch_size_per_gpu: 4
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.20
    enforce_eager: true
    max_model_len: 1024
    agent:
      num_workers: 8

  ref:
    fsdp_config:
      fsdp_size: -1

# ── Algorithm ─────────────────────────────────────────────────────────────
algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: false

# ── Reward ────────────────────────────────────────────────────────────────
reward:
  custom_reward_function:
    path: ${user_code_dir}/onpolicy/rewards/detection_reward.py
    name: compute_score
  reward_manager:
    source: register
    name: naive

# ── Trainer ───────────────────────────────────────────────────────────────
trainer:
  total_epochs: 1
  n_gpus_per_node: 1
  nnodes: 1
  save_freq: 2
  resume_mode: disable
  default_local_dir: ${scratch_dir}/outputs/bias_instillation/instill_owls_${run_id}
  project_name: bias_instillation
  experiment_name: instill_owls
  logger: [console, wandb]
  val_before_train: true
  test_freq: 2
  balance_batch: false
  use_legacy_worker_impl: enable
  trace_logging:
    enabled: true
    save_payloads: true
    trace_dir: ${scratch_dir}/outputs/bias_instillation/instill_owls_${run_id}/trace_logs
